name: Deploy SipanGPT Production

on:
  push:
    branches: ['feature/V2', 'main']
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Autenticarse en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Generar etiquetas de Docker válidas (Metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sipangpt
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: 4. Compilar y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 5. Desplegar en VPS por SSH y Actualizar Base de Datos
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/sipangpt
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            # 1. Esperar hasta que PostgreSQL esté listo para aceptar conexiones
            echo "Esperando a que la base de datos esté lista..."
            docker compose exec -T db-prod sh -c "until pg_isready -U postgres; do sleep 1; done"

            # 2. Asegurar que la extensión pgvector esté activa
            docker compose exec -T db-prod psql -U postgres -d sipangpt_prod -c "CREATE EXTENSION IF NOT EXISTS vector;"

            # 3. Aplicar las tablas del esquema Prisma automáticamente
            docker compose exec -T -u 0 app npx prisma db push --accept-data-loss

            docker image prune -f
